name: LearnCards
options:
  bundleIdPrefix: com.robertogiordano
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  LearnCore:
    path: Packages/LearnCore
targets:
  LearnCards:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: LearnCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertogiordano.learncards
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LearnCards
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Take photos of exercise pages to extract the words to learn."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Used for the exercises where you say words in German."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Recognises the German words you say in the exercises."
